<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Evolution Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #002b2b;
            color: #e2e8f0;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .accent-text { color: #00ced1; }
        .accent-bg { background-color: #00ced1; }
        .border-teal { border-color: #004d4d; }
        .card-bg { background-color: rgba(0, 77, 77, 0.3); backdrop-filter: blur(10px); }
        .glow-effect { box-shadow: 0 0 20px rgba(0, 206, 209, 0.2); }
    </style>
</head>
<body class="min-h-screen p-6 lg:p-12">

    <!-- Header Area -->
    <header class="max-w-6xl mx-auto mb-16 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
        <div>
            <h1 class="text-4xl font-bold tracking-tight">
                <span class="accent-text">HERMES</span>_EVOLUTION
            </h1>
            <p class="mono text-sm opacity-70 mt-2" id="vision-text">Loading vision context...</p>
        </div>
        <div class="text-right mono text-xs opacity-50">
            <p>Sovereign Executive Suite</p>
            <p id="current-date"></p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Timeline / Evolution -->
        <section class="lg:col-span-1 space-y-6">
            <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                <span class="accent-bg w-2 h-6 rounded-full"></span> Evolution Path
            </h2>
            <div id="timeline" class="space-y-4 border-l-2 border-teal pl-4 ml-2">
                <!-- Dynamic Content -->
            </div>
        </section>

        <!-- Skill Graph -->
        <section class="lg:col-span-2 space-y-8">
            <div>
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                    <span class="accent-bg w-2 h-6 rounded-full"></span> Core Capabilities
                </h2>
                <div id="core-skills" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dynamic Content -->
                </div>
            </div>

            <div>
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                    <span class="accent-bg w-2 h-6 rounded-full"></span> Acquired Skills
                </h2>
                <div id="acquired-skills" class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </section>
    </main>

    <script>
        async function loadManifest() {
            try {
                const response = await fetch('skills_manifest.json');
                const data = await response.json();

                // Set Metadata
                document.getElementById('vision-text').innerText = `${data.metadata.core_focus} | ${data.metadata.vision}`;
                document.getElementById('current-date').innerText = new Date().toDateString().toUpperCase();

                // Render Timeline
                const timeline = document.getElementById('timeline');
                data.evolution.forEach(item => {
                    timeline.innerHTML += `
                        <div class="relative mb-6">
                            <div class="absolute -left-6 top-1 w-3 h-3 rounded-full accent-bg glow-effect"></div>
                            <p class="mono text-xs accent-text" style="margin-left: 0">${item.date}</p>
                            <h3 class="font-semibold text-sm">${item.event}</h3>
                            <p class="text-xs opacity-70 mt-1">${item.description}</p>
                        </div>
                    `;
                });

                // Render Core Skills
                const coreSection = document.getElementById('core-skills');
                data.skill_graph.core_capabilities.forEach(skill => {
                    coreSection.innerHTML += `
                        <div class="card-bg p-4 rounded-lg border border-teal glow-effect transition-all hover:scale-[1.02]">
                            <h3 class="font-bold accent-text mb-2">${skill.title}</h3>
                            <p class="text-sm opacity-80">${skill.description}</p>
                        </div>
                    `;
                });

                // Render Acquired Skills
                const acquiredSection = document.getElementById('acquired-skills');
                data.skill_graph.acquired_skills.forEach(skill => {
                    acquiredSection.innerHTML += `
                        <div class="p-3 rounded border border-teal bg-opacity-20 bg-slate-800 flex justify-between items-center">
                            <div>
                                <p class="text-xs font-medium">${skill.name}</p>
                                <p class="text-[10px] opacity-50 mono">${skill.category}</p>
                            </div>
                            <span class="text-[10px] px-2 py-1 rounded-full border border-accent-text accent-text uppercase font-bold">
                                ${skill.level}
                            </span>
                        </div>
                    `;
                });

            } catch (error) {
                console.error("Error loading manifest:", error);
                document.body.innerHTML = `<div class="p-10 text-center">Error loading skills_manifest.json. Please ensure both files are in the same folder.</div>`;
            }
        }

        loadManifest();
    </script>
</body>
</html>
